apiVersion: v1
kind: ConfigMap
metadata:
  name: infer-service-config
data:
  INFER_MODEL_PATH: /models/mobilenetv2-12.onnx
  INFER_LABELS_PATH: /models/synset.txt
  INFER_BATCH_MAX: "1"          # micro-batching off on CPU (measured: no gain); set 8 on accelerators
  INFER_BATCH_WAIT_MS: "4"
  INFER_INTRA_OP_THREADS: "2"   # keep equal to the CPU limit below
  INFER_LOG_LEVEL: INFO
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infer-service
  labels:
    app.kubernetes.io/name: infer-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infer-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infer-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # The model is fetched into an emptyDir at pod start so the image stays small and model
      # versions can change without rebuilding it.
      initContainers:
        - name: fetch-model
          image: curlimages/curl:8.10.1
          command: ["sh", "-c"]
          args:
            - >-
              curl -fsSL -o /models/mobilenetv2-12.onnx
              https://github.com/onnx/models/raw/main/validated/vision/classification/mobilenet/model/mobilenetv2-12.onnx &&
              curl -fsSL -o /models/synset.txt
              https://raw.githubusercontent.com/onnx/models/main/validated/vision/classification/synset.txt
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: api
          image: ghcr.io/sergio4848/inference-service-bench:0.1.0
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: infer-service-config
            - secretRef:
                name: infer-service-secrets
                optional: true
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: infer-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: infer-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: infer-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: infer-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
