name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: inference-service-bench:ci
      - name: Smoke test (no model mounted -> readiness must report 503, health 200)
        run: |
          docker run -d --rm --name infer -p 8000:8000 inference-service-bench:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/healthz && break || sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/readyz)
          test "$code" = "503"
          docker stop infer
